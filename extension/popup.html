<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dropyhub Activity Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 2px 6px;
      border-radius: 10px;
      text-transform: uppercase;
    }
    h3 {
      font-size: 15px;
      margin: 0;
      color: #ffffff;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    input:focus {
      border-color: #6366f1;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>Dropyhub Tracker</h3>
    <span class="badge">Companion</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">Connected & Active</span>
    </div>
    <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;" id="connected-email">Not configured</div>
  </div>

  <div class="input-group">
    <label>Work Email</label>
    <input type="email" id="email-input" placeholder="name@dropyhub.com">
  </div>

  <button id="save-btn">Save & Start Tracking</button>

  <div class="footer">
    Teams-Style Real-time Presence Sync
  </div>

  <script src="popup.js"></script>
</body>
</html>
